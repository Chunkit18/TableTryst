<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TableTryst - Food Menu</title>
    <script src="https://kit.fontawesome.com/a076d05399.js" crossorigin="anonymous"></script>
    <style>
        .bg-color {
            background: #0f0f0ffb;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            z-index: 1000;
            padding: 15px 0;
        }

        .navbar-brand {
            color: #f8aa02;
            font-weight: bold;
            font-size: 35px !important;
        }

        .nav-link {
            font-weight: bold;
            color: #f8aa02 !important;
            font-size: 20px;
            padding: 12px 18px;
            transition: color 0.3s ease, transform 0.2s;
        }

        .nav-link:hover {
            color: white !important;
            transform: scale(1.1);
        }

        .food-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            padding: 20px;
            max-width: 1200px;
            margin: 100px auto 20px;
        }

        .food-item {
            background: white;
            padding: 15px;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
            text-align: center;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .food-item:hover {
            transform: scale(1.05);
            box-shadow: 0 6px 12px rgba(0, 0, 0, 0.3);
        }

        .cart {
            margin-top: 20px;
            padding: 15px;
            border: 1px solid #ccc;
            border-radius: 10px;
            background: #f8f8f8;
            max-width: 600px;
            margin-left: auto;
            margin-right: auto;
        }

        .cart ul {
            padding: 0;
            list-style: none;
        }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg bg-color">
        <div class="container">
            <a class="navbar-brand" href="#">Food Ordering</a>
            <div class="order-lg-last btn-group">
                <i class="fas fa-shopping-bag fa-2x"></i>
            </div>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#myNav" aria-controls="myNav" aria-expanded="false" aria-label="Toggle navigation">
                <i class="fas fa-bars"></i>
            </button>
            <div class="collapse navbar-collapse" id="myNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a href="Homepage.html" class="nav-link">Home</a></li>
                    <li class="nav-item"><a href="#" class="nav-link">Categories</a></li>
                    <li class="nav-item"><a href="#" class="nav-link">Meals</a></li>
                    <li class="nav-item"><a href="Cart.html" class="nav-link">Cart</a></li>
                    <li class="nav-item"><a href="SelectRestaurant.html" class="nav-link">Booking</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <h1 class="text-center mt-5">Food Menu</h1>
    <div class="food-container">
        <div class="food-item">
            <img src="https://www.allrecipes.com/thmb/UgUZpaTRGWIHEk57yWMhMEjffiY=/1500x0/filters:no_upscale()/16160-juicy-grilled-chicken-breasts.jpg" alt="Grilled Chicken">
            <h3>Grilled Chicken</h3>
            <p>$12.99</p>
            <button class="btn btn-primary add-to-cart" data-name="Grilled Chicken" data-price="12.99">Add to Cart</button>
        </div>
        <div class="food-item">
            <img src="https://www.allrecipes.com/thmb/a_0W8yk_LLCtH-VPqg2uLD9I5Pk=/0x512/filters:no_upscale()/pasta-carbonara.jpg" alt="Pasta Carbonara">
            <h3>Pasta Carbonara</h3>
            <p>$10.99</p>
            <button class="btn btn-primary add-to-cart" data-name="Pasta Carbonara" data-price="10.99">Add to Cart</button>
        </div>
        <div class="food-item">
            <img src="https://cdn.shopify.com/s/files/1/0274/9503/9079/files/margherita.jpg?v=1723650067" alt="Margherita Pizza">
            <h3>Margherita Pizza</h3>
            <p>$8.99</p>
            <button class="btn btn-primary add-to-cart" data-name="Margherita Pizza" data-price="8.99">Add to Cart</button>
        </div>
    </div>

    <h2 class="text-center mt-4">Your Cart</h2>
    <div class="cart">
        <ul id="cart-list"></ul>
        <p><strong>Total:</strong> $<span id="cart-total">0.00</span></p>
        <form id="order-form" action="cart.php" method="POST">
            <input type="hidden" name="cart_data" id="cart-data">
            <button type="submit" class="btn btn-success">Place Order</button>
        </form>
    </div>

    <script>
        let cart = [];

        document.querySelectorAll('.add-to-cart').forEach(button => {
            button.addEventListener('click', function() {
                let name = this.getAttribute('data-name');
                let price = parseFloat(this.getAttribute('data-price'));

                cart.push({ name, price });
                updateCart();
            });
        });

        function updateCart() {
            let cartList = document.getElementById('cart-list');
            let cartTotal = document.getElementById('cart-total');
            let cartDataInput = document.getElementById('cart-data');

            cartList.innerHTML = "";
            let total = 0;

            cart.forEach(item => {
                let li = document.createElement('li');
                li.textContent = `${item.name} - $${item.price.toFixed(2)}`;
                cartList.appendChild(li);
                total += item.price;
            });

            cartTotal.textContent = total.toFixed(2);
            cartDataInput.value = JSON.stringify(cart); // Pass to PHP
        }
    </script>
</body>
</html>
