<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TableTryst - Food Menu</title>
    <style>
        .bg-color {
            background: #0f0f0ffb;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            z-index: 1000;
            padding: 15px 0;
        }

        .navbar-brand {
            color: #f8aa02;
            font-weight: bold;
            font-size: 35px !important;
        }

        .nav-link {
            font-weight: bold;
            color: #f8aa02 !important;
            font-size: 20px;
            padding: 12px 18px;
            transition: color 0.3s ease, transform 0.2s;
        }

        .nav-link:hover {
            color: white !important;
            transform: scale(1.1);
        }

        .nav-link.active {
            color: white !important;
        }

        .navbar-toggler i {
            color: #f8aa02;
        }

        .navbar-toggler:hover i {
            color: #fff;
        }

        .collapse.navbar-collapse {
            transition: all 0.3s ease-in-out;
        }

        .navbar-nav {
            text-align: right;
        }

        @media (max-width: 768px) {
            .navbar-nav {
                text-align: center;
            }
        }

        .food-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            padding: 20px;
            max-width: 1200px;
            margin: 100px auto 20px;
        }

        .food-item {
            background: white;
            padding: 15px;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
            text-align: center;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .food-item:hover {
            transform: scale(1.05);
            box-shadow: 0 6px 12px rgba(0, 0, 0, 0.3);
        }

        .food-item img {
            width: 100%;
            height: 180px;
            object-fit: cover;
            border-radius: 8px;
        }

        .food-item h3 {
            margin-top: 10px;
            color: #444;
        }

        .food-item p {
            color: #777;
            font-weight: bold;
        }

        .cart-sidebar {
    position: fixed;
    top: 0;
    right: -300px; /* Initially hidden */
    width: 300px;
    height: 100%;
    background: #fff;
    box-shadow: -2px 0px 10px rgba(0, 0, 0, 0.2);
    padding: 20px;
    overflow-y: auto;
    transition: right 0.3s ease-in-out;
}

.cart-sidebar.open {
    right: 0;
}

.cart-item {
    display: flex;
    justify-content: space-between;
    margin-bottom: 10px;
    padding: 10px;
    border-bottom: 1px solid #ddd;
}

    </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg bg-color">
        <div class="container">
            <a class="navbar-brand" href="#">Food Ordering</a>
            <div class="order-lg-last btn-group">
                <i class="fas fa-shopping-bag fa-2x"></i>
            </div>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#myNav" aria-controls="myNav" aria-expanded="false" aria-label="Toggle navigation">
                <i class="fas fa-bars"></i>
            </button>
            <div class="collapse navbar-collapse" id="myNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a href="Homepage.html" class="nav-link">Home</a></li>
                    <li class="nav-item"><a href="#" class="nav-link">Categories</a></li>
                    <li class="nav-item"><a href="#" class="nav-link">Meals</a></li>
                    <li class="nav-item"><a href="Cart.html" class="nav-link">Cart</a></li>
                    <li class="nav-item"><a href="SelectRestaurant.html" class="nav-link">Booking</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <h1 class="text-center mt-5">Food Menu</h1>
    <div class="food-container">
        <div class="food-item">
            <img src="https://www.allrecipes.com/thmb/UgUZpaTRGWIHEk57yWMhMEjffiY=/1500x0/filters:no_upscale():max_bytes(150000):strip_icc()/16160-juicy-grilled-chicken-breasts-ddmfs-5594-hero-3x4-902673c819994c0191442304b40104af.jpg" alt="Grilled Chicken">
            <h3>Grilled Chicken</h3>
            <p>$12.99</p>
            <button class="btn btn-primary add-to-cart" data-name="Grilled Chicken" data-price="12.99">Add to Cart</button>
        </div>
        <div class="food-item">
            <img src="https://www.allrecipes.com/thmb/a_0W8yk_LLCtH-VPqg2uLD9I5Pk=/0x512/filters:no_upscale():max_bytes(150000):strip_icc()/11973-spaghetti-carbonara-ii-DDMFS-4x3-6edea51e421e4457ac0c3269f3be5157.jpg" alt="Pasta Carbonara">
            <h3>Pasta Carbonara</h3>
            <p>$10.99</p>
            <button class="btn btn-primary add-to-cart" data-name="Pasta Carbonara" data-price="10.99">Add to Cart</button>
        </div>
        <div class="food-item">
            <img src="https://cdn.shopify.com/s/files/1/0274/9503/9079/files/20220211142754-margherita-9920_5a73220e-4a1a-4d33-b38f-26e98e3cd986.jpg?v=1723650067" alt="Margherita Pizza">
            <h3>Margherita Pizza</h3>
            <p>$8.99</p>
            <button class="btn btn-primary add-to-cart" data-name="Margherita Pizza" data-price="8.99">Add to Cart</button>
        </div>
    </div> 
    
    <button id="viewCartBtn" class="btn btn-primary">View Cart</button>

<div id="cartSidebar" class="cart-sidebar">
    <h3>Cart (<span id="cartCount">0</span> items)</h3>
    <div id="cartItems"></div>
    <hr>
    <p><strong>Subtotal:</strong> $<span id="cartTotal">0.00</span></p>
    <button class="btn btn-danger" id="checkoutBtn">Checkout</button>
    <button class="btn btn-secondary" id="closeCartBtn">Close</button>
</div>   
</body>
<script>
    let cart = JSON.parse(localStorage.getItem("cart")) || [];

    function updateCartDisplay() {
        let cartItems = document.getElementById("cartItems");
        let cartCount = document.getElementById("cartCount");
        let cartTotal = document.getElementById("cartTotal");

        cartItems.innerHTML = "";
        let total = 0;
        
        cart.forEach((item, index) => {
            total += item.price * item.quantity;
            cartItems.innerHTML += `
                <div class="cart-item">
                    <span>${item.name} (${item.quantity})</span>
                    <span>$${(item.price * item.quantity).toFixed(2)}</span>
                </div>
            `;
        });

        cartCount.innerText = cart.length;
        cartTotal.innerText = total.toFixed(2);
        localStorage.setItem("cart", JSON.stringify(cart));
    }

    document.getElementById("viewCartBtn").addEventListener("click", function () {
        document.getElementById("cartSidebar").classList.add("open");
        updateCartDisplay();
    });

    document.getElementById("closeCartBtn").addEventListener("click", function () {
        document.getElementById("cartSidebar").classList.remove("open");
    });

    updateCartDisplay();
</script>

</html>
